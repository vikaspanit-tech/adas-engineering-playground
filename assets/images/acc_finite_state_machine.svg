<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Adaptive cruise control finite state machine">
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Adaptive Cruise Control State Machine</text>
  <g font-family="Arial, sans-serif">
    <rect x="75" y="250" width="220" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="185" y="296" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">Cruise</text><text x="185" y="326" text-anchor="middle" font-size="17" fill="#1e3a8a">Maintain set speed</text>
    <rect x="380" y="250" width="220" height="105" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="490" y="296" text-anchor="middle" font-size="26" font-weight="700" fill="#166534">Follow</text><text x="490" y="326" text-anchor="middle" font-size="17" fill="#166534">Time-gap control</text>
    <rect x="685" y="250" width="220" height="105" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="795" y="292" text-anchor="middle" font-size="24" font-weight="700" fill="#991b1b">Emergency Brake</text><text x="795" y="326" text-anchor="middle" font-size="17" fill="#991b1b">TTC safety response</text>
    <rect x="980" y="250" width="160" height="105" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="1060" y="296" text-anchor="middle" font-size="26" font-weight="700" fill="#92400e">Recover</text><text x="1060" y="326" text-anchor="middle" font-size="16" fill="#92400e">Smooth exit</text>
    <line x1="295" y1="302" x2="380" y2="302" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="337" y="230" text-anchor="middle" font-size="17" fill="#334155">Time gap &lt; 2.2 s</text>
    <line x1="600" y1="302" x2="685" y2="302" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="642" y="230" text-anchor="middle" font-size="17" fill="#334155">TTC &lt; 7 s</text>
    <line x1="905" y1="302" x2="980" y2="302" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="942" y="230" text-anchor="middle" font-size="16" fill="#334155">Safe + hold complete</text>
    <path d="M1060 355 C1060 470 490 480 490 355" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="780" y="505" text-anchor="middle" font-size="18" fill="#334155">If still close: return to Follow; if risk returns: Emergency Brake</text>
    <path d="M490 250 C490 145 185 145 185 250" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="337" y="125" text-anchor="middle" font-size="17" fill="#334155">Time gap &gt; 2.8 s and not closing</text>
    <text x="600" y="595" text-anchor="middle" font-size="20" fill="#334155">Hysteresis and minimum hold time prevent unstable switching.</text>
  </g>
</svg>
