<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="Pure Pursuit lane following geometry">
  <rect width="1200" height="580" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Pure Pursuit Lane-Following Geometry</text>
  <path d="M70 370 C280 180, 560 420, 1130 195" fill="none" stroke="#111827" stroke-width="7" stroke-dasharray="18 14"/>
  <text x="925" y="162" font-family="Arial, sans-serif" font-size="20" fill="#111827">Reference lane centre</text>
  <path d="M95 395 C300 250, 570 405, 780 315" fill="none" stroke="#2563eb" stroke-width="8"/>
  <text x="210" y="470" font-family="Arial, sans-serif" font-size="20" fill="#2563eb">Ego path</text>
  <g transform="translate(345 330) rotate(-9)">
    <rect x="-64" y="-31" width="128" height="62" rx="8" fill="#1d4ed8"/>
    <rect x="25" y="-23" width="24" height="46" fill="#93c5fd"/>
  </g>
  <text x="300" y="302" font-family="Arial, sans-serif" font-size="20" fill="#1e3a8a">Ego vehicle</text>
  <circle cx="345" cy="330" r="8" fill="#dc2626"/>
  <circle cx="730" cy="333" r="11" fill="#16a34a"/>
  <text x="746" y="328" font-family="Arial, sans-serif" font-size="20" fill="#166534">Target point</text>
  <line x1="345" y1="330" x2="730" y2="333" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="510" y="315" font-family="Arial, sans-serif" font-size="21" fill="#166534">Look-ahead distance Ld</text>
  <path d="M394 332 A53 53 0 0 0 387 313" fill="none" stroke="#ea580c" stroke-width="5"/>
  <text x="410" y="300" font-family="Arial, sans-serif" font-size="22" fill="#c2410c">α</text>
  <line x1="345" y1="330" x2="475" y2="310" stroke="#ea580c" stroke-width="5"/>
  <text x="80" y="535" font-family="Arial, sans-serif" font-size="22" fill="#334155">δ = atan( 2L sin(α) / Ld )</text>
  <text x="550" y="535" font-family="Arial, sans-serif" font-size="20" fill="#334155">Speed-adaptive Ld makes high-speed steering smoother.</text>
</svg>
