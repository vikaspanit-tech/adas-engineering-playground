<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Integrated lane keeping assist and adaptive cruise control feedback architecture">
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#334155"/></marker></defs>
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Integrated LKA + ACC Closed-Loop Architecture</text>
  <g font-family="Arial, sans-serif" font-size="19" text-anchor="middle">
    <rect x="45" y="150" width="200" height="72" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="145" y="193" fill="#0c4a6e">Lane-centre reference</text>
    <rect x="45" y="345" width="200" height="72" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="145" y="388" fill="#92400e">Lead-vehicle state</text>
    <rect x="335" y="135" width="210" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="440" y="178" fill="#1e3a8a">Speed-adaptive</text><text x="440" y="206" fill="#1e3a8a">Pure Pursuit</text>
    <rect x="335" y="330" width="210" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="440" y="373" fill="#166534">ACC finite-state</text><text x="440" y="401" fill="#166534">machine</text>
    <rect x="655" y="135" width="175" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="742" y="179" fill="#5b21b6">Steering</text><text x="742" y="207" fill="#5b21b6">actuator</text>
    <rect x="655" y="330" width="175" height="100" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="742" y="374" fill="#9d174d">Acceleration</text><text x="742" y="402" fill="#9d174d">actuator</text>
    <rect x="930" y="205" width="215" height="150" rx="15" fill="#e2e8f0" stroke="#334155" stroke-width="4"/><text x="1037" y="260" fill="#0f172a">Kinematic bicycle</text><text x="1037" y="289" fill="#0f172a">vehicle + gap model</text><text x="1037" y="322" font-size="16" fill="#475569">pose, speed, gap</text>
    <line x1="245" y1="186" x2="335" y2="186" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
    <line x1="245" y1="381" x2="335" y2="381" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
    <line x1="545" y1="186" x2="655" y2="186" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
    <line x1="545" y1="381" x2="655" y2="381" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
    <line x1="830" y1="186" x2="930" y2="245" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
    <line x1="830" y1="381" x2="930" y2="315" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
    <path d="M1037 355 C1037 515 440 520 440 430" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
    <text x="730" y="555" font-size="18" fill="#334155">Shared ego speed couples longitudinal ACC to lateral look-ahead distance.</text>
  </g>
</svg>
